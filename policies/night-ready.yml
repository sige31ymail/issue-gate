# Shared night-ready policy.
#
# This file holds every number the gate decides on. It is deliberately readable
# and version-controlled: the final business logic must not live inside a model
# prompt. Thresholds below are starting values, not validated production values.
version: 1
gate: night-ready

labels:
  # The label night-issues already consumes. If the established name differs,
  # change it here rather than renaming the label in the target repositories.
  night_ready: night-queue
  needs_detail: needs-detail
  needs_split: needs-split
  human_review: human-review
  blocked: blocked

# Thresholds below are written as the value an answer must actually reach.
#
# An earlier version kept a symmetric dead band around every threshold, which
# meant the written number and the effective one differed: 0.90 passed at 0.95.
# The two-column bookkeeping cost more than it bought — it produced a threshold
# nothing could reach and needed a dedicated guard to catch that — so the band is
# zero and the numbers say what they mean.
dead_band: 0.0

# Half-width of the undecided band around 0.5.
#
# Nearness to a threshold does not measure indecision. Measured against six real
# Issues, 0.93 on a 0.95 bar was a confident answer landing just short, while the
# answers that carried no signal sat near the middle. This band catches those. It
# never outranks a failing check, so an Issue with a nameable problem is still
# told what the problem is.
ambiguity_band: 0.10

# Only these Issue authors are evaluated. A READY result admits an Issue to an
# unattended run with repository write access, so the set of people who can
# trigger that is a deterministic check, never a model judgment.
#
# claude[bot] is on the list because the operating model is that an LLM writes
# and refines these Issues; without it the gate would reject most of what it
# exists to judge. Note the exact login: the API reports a GitHub App as
# "<app>[bot]", so a bare "claude" would never match.
#
# An empty list allows every author.
allowed_authors:
  - sige31ymail
  - claude[bot]

# Issue bodies are truncated to this many characters before reaching Jev.
max_issue_chars: 12000

checks:
  scope_small_enough:
    kind: noul
    # Corpus: 0.29-0.38 for multi-system features, 0.60-0.81 for single changes.
    min_yes_probability: 0.70
    outcome: NEEDS_SPLIT
    instructions: >-
      Can this Issue reasonably be completed in a single unattended coding-agent
      run, without a person intervening partway through?
    criteria:
      true: >-
        The work is a single coherent change: a bounded set of files, one
        feature or fix, with no need to pause for input.
      false: >-
        The Issue bundles several independent changes, spans a broad refactor,
        or describes a project rather than a task.

  acceptance_criteria_clear:
    kind: noul
    # Corpus: 0.64-0.80 where the Issue has no completion section, 0.92-0.95
    # where it lists concrete criteria. The cleanest separation of the six.
    min_yes_probability: 0.70
    outcome: NEEDS_DETAIL
    instructions: >-
      Are the acceptance criteria concrete enough that a reader could tell
      whether the implementation succeeded?
    criteria:
      true: >-
        The Issue states what the finished result must do, in specific terms.
      false: >-
        The Issue describes a problem or a wish without saying what "done"
        looks like.

  acceptance_criteria_verifiable:
    kind: noul
    # Corpus: 0.52-0.78 against 0.89-0.93. Tracks the check above but runs lower
    # on visual work, where objective verification is genuinely harder.
    min_yes_probability: 0.70
    outcome: NEEDS_DETAIL
    instructions: >-
      Can completion be verified objectively — by tests, a command, a check, a
      file's contents, or a UI verification that the Issue describes or that is
      clearly inferable from it?
    criteria:
      true: >-
        A concrete way to confirm the result exists or is obvious from the
        Issue.
      false: >-
        Confirming the result would rely on someone's subjective judgment.

  requires_human_decision:
    kind: noul
    # Corpus: 0.25-0.27 for Issues that settle their own approach, 0.55-0.76 for
    # the ones that leave it open. The check discriminates; the original 0.10
    # simply sat below everything it measured.
    max_yes_probability: 0.35
    # NEEDS_DETAIL, not HUMAN_REVIEW. An unsettled decision is something the
    # Issue's author can fix by writing the decision down, which is the cheapest
    # repair available. Mapping it to HUMAN_REVIEW pinned every feature Issue at
    # that outcome and made NEEDS_SPLIT and NEEDS_DETAIL unreachable.
    outcome: NEEDS_DETAIL
    instructions: >-
      Does implementing this Issue require a product, UX, architecture, or
      security decision that the Issue has not already settled?
    criteria:
      true: >-
        An open decision remains that a person would need to make.
      false: >-
        The approach is either specified or a matter of routine implementation
        judgment.

  dependency_blocked:
    kind: noul
    # Corpus: 0.05-0.24 for independent Issues, 0.75-0.83 for two that genuinely
    # wait on a third. The check found a real dependency chain, and the gap
    # between the two groups is wide enough that the line's exact place is not
    # delicate.
    max_yes_probability: 0.35
    outcome: BLOCKED
    instructions: >-
      Is this Issue blocked by another Issue, a change in another repository, a
      missing credential, an unavailable environment, or any unresolved
      prerequisite?
    criteria:
      true: >-
        Something outside this Issue must land or be provided first.
      false: >-
        The work can start immediately with what the repository already has.

  safe_for_unattended_execution:
    kind: noul
    # PROVISIONAL, and the loosest number here on purpose.
    #
    # Across six Issues this check returned 0.71-0.93 while every one of them was
    # a source-only change to a browser game: no production data, no secrets, no
    # published artifact. What it actually tracked was Issue size, not risk — the
    # large features scored lowest. It is not currently separating safe from
    # unsafe, so a strict bar here would only mask the checks that do work, which
    # is what the previous 0.95 did.
    #
    # 0.70 admits this corpus, which is the right answer for a corpus that is
    # uniformly safe. Raise it once the question has been rewritten and
    # re-measured; see docs/architecture.md.
    min_yes_probability: 0.70
    outcome: HUMAN_REVIEW
    instructions: >-
      Is this Issue safe to implement unattended, with no person watching the
      run? Consider destructive operations, production or user data, secrets,
      credentials, published releases, and anything irreversible.
    criteria:
      true: >-
        The change is confined to the repository's own source and is reversible
        by ordinary version control.
      false: >-
        The work touches production systems, real user data, secrets, published
        artifacts, or anything a mistake would make hard to undo.
